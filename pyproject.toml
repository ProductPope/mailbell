[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbell"
version = "0.2.0"
description = "Rings a bell when an important email arrives. Runs fully on your computer with the Nimble decision model via Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["keyring>=24"]
keywords = ["email", "imap", "ollama", "nimble", "local-ai", "notifications", "classification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Email",
]

[project.scripts]
mailbell = "mailbell.cli:main"

[tool.setuptools]
packages = ["mailbell"]
